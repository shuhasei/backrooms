<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8c7d32" />
  <title>Infinite Backrooms</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud" aria-live="polite">
    <div class="title">INFINITE BACKROOMS</div>
    <div class="instructions">クリックで開始 · WASD 移動 · Shift 走る · M 音</div>
    <div id="status">procedural level 0</div>
  </div>

  <button id="start" type="button">ENTER</button>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>

  <noscript>このコンテンツには JavaScript が必要です。</noscript>
  <script type="module" src="./game.js"></script>
</body>
</html>
